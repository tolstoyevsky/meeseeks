name: Linter Runner

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run pylint
        run: uv run pylint --rcfile=.pylintrc .
      - name: Run mypy
        run: uv run mypy --exclude=tests/ --exclude=apps/ .
      - name: Run tests
        env:
          ROCKET_CHAT_API: http://localhost:8006/api/v1
          USER_NAME: meeseeks
          PASSWORD: testpassword
          COMPANY_NAME: TestCompany
          PG_NAME: happy_birthder_base
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: testpassword
          GIPHY_API_KEY: dummy-giphy-key
        run: env PYTHONPATH=$(pwd) uv run python tests/run_tests.py
